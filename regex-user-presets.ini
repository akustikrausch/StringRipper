; StringRipper regex user presets
; Drop it next to StringRipper.exe, it moves into the data folder on first start.
; Pick a preset from the dropdown in regex mode.

[Regex User Preset: Support ticket IDs]
Description=Find ticket references such as TKT-123456 in text and log files.
Regex=\\bTKT-[0-9]{6}\\b
Positive=TKT-123456
Negative=ABC-123456
Validated=1

ASCII=1
UTF-16=1
HEX=0
BASE64=0

Custom=1
Email=0
IPv4=0
IPv6=0
GUID=0
APIKey=0
Filepath=0
Download=0

[Regex User Preset: Semantic versions]
Description=Find simple semantic version strings such as v2.14.3.
Regex=\\bv?[0-9]+\\.[0-9]+\\.[0-9]+\\b
Positive=v2.14.3
Negative=version 2.14
Validated=1

ASCII=1
UTF-16=1
HEX=0
BASE64=0

Custom=1
Email=0
IPv4=0
IPv6=0
GUID=0
APIKey=0
Filepath=0
Download=0
